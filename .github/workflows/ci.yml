name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json#packageManager, which Vercel also uses.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test:unit

      # Runs the built app with `next start` against throwaway SQLite files.
      - name: HTTP tests
        run: pnpm test:http

      # The built app in headless Chrome (preinstalled on GitHub's Ubuntu runners).
      - name: Browser tests
        run: pnpm test:e2e

      - name: Upload browser-test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/e2e/.artifacts/
          if-no-files-found: ignore
