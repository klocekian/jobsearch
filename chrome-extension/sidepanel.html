<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; font-size: 13px; color: #1e293b; padding: 20px; }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 600; color: #64748b; margin-bottom: 3px; margin-top: 12px; }
    label:first-of-type { margin-top: 0; }
    input, textarea, select { width: 100%; border: 1px solid #cbd5e1; border-radius: 6px; padding: 7px 10px; font-size: 13px; font-family: inherit; color: #1e293b; outline: none; }
    input:focus, textarea:focus, select:focus { border-color: #e9090a; box-shadow: 0 0 0 2px rgba(233,9,10,0.1); }
    textarea { resize: vertical; min-height: 80px; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    .actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
    button { border: none; border-radius: 8px; padding: 7px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: #e9090a; color: white; }
    .btn-primary:hover { background: #c20808; }
    .btn-primary:disabled { opacity: 0.5; cursor: default; }
    .btn-secondary { background: #f1f5f9; color: #475569; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-secondary:disabled { opacity: 0.5; cursor: default; }
    .status { margin-top: 12px; font-size: 12px; padding: 8px 10px; border-radius: 6px; line-height: 1.4; }
    .status.info { background: #eff6ff; color: #1d4ed8; }
    .status.success { background: #f0fdf4; color: #15803d; }
    .status.error { background: #fef2f2; color: #dc2626; }
    .badge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 6px; border-radius: 4px; background: #f1f5f9; color: #64748b; margin-left: 6px; }
    #postingPreview { font-size: 12px; color: #64748b; line-height: 1.5; }
    a { color: inherit; }
    .divider { border-top: 1px solid #e2e8f0; margin: 16px 0; }
    .tabs { display: flex; background: #f1f5f9; border-radius: 20px; padding: 3px; margin-bottom: 14px; }
    .tab { flex: 1; padding: 6px; text-align: center; font-size: 12px; font-weight: 600; cursor: pointer; border-radius: 16px; color: #64748b; transition: all 0.15s; }
    .tab.active { background: #1e293b; color: white; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .field-row { display: flex; align-items: center; padding: 7px 8px; border-bottom: 1px solid #f1f5f9; cursor: pointer; border-radius: 4px; }
    .field-row:hover { background: #f8fafc; }
    .field-label { font-size: 10px; font-weight: 600; color: #94a3b8; width: 80px; flex-shrink: 0; }
    .field-value { font-size: 12px; color: #1e293b; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .field-value.empty { color: #cbd5e1; font-style: italic; }
    .copied-flash { color: #15803d !important; font-weight: 600; }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
    <h1 style="margin-bottom:0">Job Search Clipper</h1>
    <button id="refreshBtn" style="background:none;border:none;cursor:pointer;font-size:14px;color:#94a3b8;padding:4px" title="Refresh">&#x21bb;</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tabClip">Clip</div>
    <div class="tab" id="tabFill">Fill</div>
  </div>

  <!-- CLIP TAB -->
  <div id="clipContent">
    <button class="btn-primary" id="clipBtn" style="width:100%; margin-bottom:8px">Clip this page</button>

    <div id="recentJobs" style="margin-bottom:12px"></div>

    <div id="loading" class="status info" style="display:none">Extracting page content…</div>

    <form id="form" style="display:none">
      <div class="divider"></div>

      <label>Company</label>
      <input id="company" placeholder="Company name">

      <label>Job Title</label>
      <input id="title" placeholder="Job title">

      <div class="row">
        <div>
          <label>Location</label>
          <input id="location" placeholder="City, State">
        </div>
        <div>
          <label>Remote</label>
          <select id="remoteType">
            <option value="">—</option>
            <option value="remote">Remote</option>
            <option value="hybrid">Hybrid</option>
            <option value="onsite">On-site</option>
          </select>
        </div>
      </div>

      <label>Salary</label>
      <input id="salary" placeholder="$150k–$200k">

      <label>URL</label>
      <input id="url" readonly style="color: #94a3b8; font-size: 11px;">

      <label>
        Job Description
        <span id="charCount" class="badge"></span>
      </label>
      <textarea id="postingPreview" placeholder="Paste or edit job description…" style="min-height:150px"></textarea>

      <div class="actions">
        <button type="submit" class="btn-primary" id="saveBtn">Save Job</button>
        <button type="button" class="btn-secondary" id="extractBtn">Re-extract with AI</button>
      </div>
    </form>

    <div id="statusMsg" style="display:none"></div>
  </div>

  <!-- FILL TAB -->
  <div id="fillContent" style="display:none">
    <button class="btn-primary" id="fillBtn" style="width:100%; margin-bottom:12px">Fill application fields</button>
    <div id="fillFields" style="font-size:12px;color:#94a3b8">Loading profile…</div>
    <div id="fillStatus" style="display:none"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
